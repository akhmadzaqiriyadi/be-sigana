version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sigana-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: sigana
      POSTGRES_PASSWORD: sigana_dev_2026
      POSTGRES_DB: sigana_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigana -d sigana_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
